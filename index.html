<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Auron Vault</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f4f5f7;color:#17191d}body{min-height:100vh;padding:24px}.wrap{max-width:760px;margin:auto}.screen{min-height:calc(100vh - 48px);display:flex;align-items:center;justify-content:center}.panel{width:100%;background:#fff;border:1px solid #e1e3e7;border-radius:20px;padding:24px;box-shadow:0 12px 35px rgba(0,0,0,.07)}.login{max-width:380px;margin:auto}.logo{width:58px;height:58px;margin:0 auto 18px;border-radius:17px;background:#17191d;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:800}.login h1{text-align:center;margin:0;font-size:27px}.sub{text-align:center;color:#737983;font-size:14px;margin:8px 0 26px}label{display:block;font-size:14px;font-weight:600;margin:0 0 15px}input,textarea{width:100%;padding:13px;border:1px solid #d7d9de;border-radius:12px;background:#fff;color:#17191d;font-size:16px;outline:0}input:focus,textarea:focus{border-color:#17191d}button{border:0;border-radius:12px;padding:13px 15px;background:#17191d;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.wide{width:100%}.error{color:#b42318;min-height:20px;font-size:13px}.hint{font-size:12px;color:#737983;line-height:1.5}.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px}.top h1{font-size:24px;margin:0}.top button{background:#e9ebef;color:#17191d}.search{margin-bottom:14px}.entry{background:#fff;border:1px solid #e1e3e7;border-radius:16px;padding:15px;margin-bottom:10px;display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:12px;background:#eef0f3;display:grid;place-items:center;font-weight:800;flex:none}.main{flex:1;min-width:0}.name{font-weight:700}.user{font-size:13px;color:#737983;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry button{background:#eef0f3;color:#17191d;font-size:13px}.empty{text-align:center;padding:45px 10px;color:#737983;background:#fff;border:1px dashed #d7d9de;border-radius:16px}.fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.2)}dialog{border:0;border-radius:18px;padding:0;width:min(92vw,520px);box-shadow:0 20px 70px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.45)}.modal{padding:22px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalHead h2{margin:0;font-size:21px}.x{background:transparent;color:#555;font-size:25px;padding:2px 8px}.row{display:flex;gap:8px}.row input{flex:1}.row button{margin-top:0;background:#eef0f3;color:#17191d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:500px){body{padding:14px}.screen{min-height:calc(100vh - 28px)}}
</style>
</head>
<body>
<div class="wrap">
<section id="loginScreen" class="screen">
<div class="panel login"><div class="logo">A</div><h1>Auron Vault</h1><p class="sub">Dein privater Passwort-Tresor</p><form id="loginForm"><label for="master">Master-Passwort</label><input id="master" type="password" minlength="12" autocomplete="current-password" required><button class="wide" type="submit">Entsperren</button><p id="loginError" class="error"></p><p class="hint">Dein Master-Passwort bleibt lokal auf diesem Gerät.</p></form></div>
</section>
<section id="vaultScreen" class="screen" style="display:none;align-items:flex-start">
<div style="width:100%"><header class="top"><h1>Auron Vault <small id="count"></small></h1><button id="lock" type="button">Sperren</button></header><div class="search"><input id="search" placeholder="Passwort suchen..." autocomplete="off"></div><div id="entries"></div><button id="add" class="fab" type="button">+</button></div>
</section>
</div>
<dialog id="dialog"><form method="dialog" id="entryForm" class="modal"><div class="modalHead"><h2 id="title">Neuer Eintrag</h2><button value="cancel" class="x" type="button" id="close">×</button></div><input type="hidden" id="id"><label>Name<input id="name" required></label><label>Website<input id="website" type="url" placeholder="https://example.com"></label><label>Benutzername<input id="username" autocomplete="off"></label><label>Passwort<div class="row"><input id="password" type="password" required autocomplete="new-password"><button type="button" id="generate">Generieren</button></div></label><label>Notiz<textarea id="notes"></textarea></label><div class="actions"><button value="cancel" class="secondary" type="button" id="cancel">Abbrechen</button><button id="save" type="submit">Speichern</button></div></form></dialog>
<script>
const DB_NAME='auron-vault-db',DB_VERSION=1,STORE='vault';let cryptoKey=null,salt=null,items=[];
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();
const random=n=>crypto.getRandomValues(new Uint8Array(n)),b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function read(){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction(STORE).objectStore(STORE).get('data');r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function write(v){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,'data');r.onsuccess=res;r.onerror=()=>rej(r.error)})}
async function derive(p,s){const b=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:600000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function save(){const iv=random(12),data=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,enc.encode(JSON.stringify(items)));await write({version:1,salt:b64(salt),iv:b64(iv),data:b64(data)})}
async function unlock(p){const old=await read();if(!old){salt=random(16);cryptoKey=await derive(p,salt);items=[];await save();return true}salt=unb64(old.salt);const k=await derive(p,salt);try{const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(old.iv)},k,unb64(old.data));items=JSON.parse(dec.decode(raw));cryptoKey=k;return true}catch{return false}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.toLowerCase(),a=items.filter(x=>(x.name+' '+x.username+' '+x.website).toLowerCase().includes(q));$('count').textContent=' · '+items.length;$('entries').innerHTML=a.length?a.map(x=>'<article class="entry"><div class="avatar">'+esc((x.name||'?')[0].toUpperCase())+'</div><div class="main"><div class="name">'+esc(x.name)+'</div><div class="user">'+esc(x.username||x.website||'')+'</div></div><button data-id="'+esc(x.id)+'" type="button">Öffnen</button></article>').join(''):'<div class="empty">Noch keine Einträge.<br>Tippe auf +, um einen Zugang zu speichern.</div>'}
function generate(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*-_=+',a=random(24);return Array.from(a,n=>c[n%c.length]).join('')}
function edit(id){const x=items.find(v=>v.id===id);if(!x)return;$('id').value=x.id;$('name').value=x.name;$('website').value=x.website||'';$('username').value=x.username||'';$('password').value=x.password;$('notes').value=x.notes||'';$('title').textContent='Eintrag bearbeiten';$('dialog').showModal()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';if($('master').value.length<12){$('loginError').textContent='Mindestens 12 Zeichen verwenden.';return}if(await unlock($('master').value)){$('master').value='';$('loginScreen').style.display='none';$('vaultScreen').style.display='flex';render()}else $('loginError').textContent='Falsches Master-Passwort.'};
$('lock').onclick=()=>{cryptoKey=null;salt=null;items=[];$('vaultScreen').style.display='none';$('loginScreen').style.display='flex'};
$('add').onclick=()=>{$('entryForm').reset();$('id').value='';$('title').textContent='Neuer Eintrag';$('dialog').showModal()};
$('close').onclick=$('cancel').onclick=()=>$('dialog').close();
$('generate').onclick=()=>{$('password').value=generate();$('password').type='text';setTimeout(()=>$('password').type='password',1200)};
$('search').oninput=render;
$('entries').onclick=e=>{const id=e.target.dataset.id;if(id)edit(id)};
$('entryForm').onsubmit=async e=>{e.preventDefault();const id=$('id').value||crypto.randomUUID(),x={id,name:$('name').value.trim(),website:$('website').value.trim(),username:$('username').value.trim(),password:$('password').value,notes:$('notes').value};const i=items.findIndex(v=>v.id===id);if(i<0)items.push(x);else items[i]=x;await save();$('dialog').close();render()};
</script>
</body>
</html>
