<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Auron Vault">
  <title>Auron Vault</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <section id="setup" class="screen hidden">
      <div class="brand"><div class="logo">A</div><h1>Auron Vault</h1></div>
      <p class="muted">Dein lokaler, verschlüsselter Passwort-Tresor.</p>
      <form id="setupForm" class="card">
        <label>Master-Passwort<input id="setupPassword" type="password" minlength="12" autocomplete="new-password" required></label>
        <label>Master-Passwort wiederholen<input id="setupPassword2" type="password" minlength="12" autocomplete="new-password" required></label>
        <button>🔐 Tresor erstellen</button>
        <p class="hint">Mindestens 12 Zeichen. Das Master-Passwort wird nicht gespeichert.</p>
      </form>
    </section>

    <section id="unlock" class="screen hidden">
      <div class="brand"><div class="logo">A</div><h1>Auron Vault</h1></div>
      <p class="muted">Entsperre deinen Tresor.</p>
      <form id="unlockForm" class="card">
        <label>Master-Passwort<input id="unlockPassword" type="password" autocomplete="current-password" required></label>
        <button>Entsperren</button>
        <p id="unlockError" class="error"></p>
      </form>
    </section>

    <section id="vault" class="screen hidden">
      <header class="topbar"><div><strong>Auron Vault</strong><span id="count" class="muted"></span></div><button id="lockBtn" class="iconBtn" aria-label="Sperren">🔒</button></header>
      <div class="search"><input id="search" placeholder="Suchen..." autocomplete="off"></div>
      <div id="entries" class="entries"></div>
      <button id="addBtn" class="fab" aria-label="Eintrag hinzufügen">＋</button>
    </section>
  </main>

  <dialog id="entryDialog">
    <form method="dialog" id="entryForm" class="dialogCard">
      <div class="dialogHead"><h2 id="dialogTitle">Neuer Eintrag</h2><button value="cancel" class="iconBtn">×</button></div>
      <input type="hidden" id="entryId">
      <label>Name<input id="entryName" required maxlength="120"></label>
      <label>Website<input id="entryUrl" type="url" placeholder="https://example.com" maxlength="500"></label>
      <label>Benutzername<input id="entryUser" autocomplete="off" maxlength="200"></label>
      <label>Passwort<div class="passwordRow"><input id="entryPass" type="password" autocomplete="new-password" required><button type="button" id="generateBtn">Generieren</button></div></label>
      <label>Notiz<textarea id="entryNote" maxlength="2000"></textarea></label>
      <div class="actions"><button value="cancel" class="secondary">Abbrechen</button><button id="saveEntryBtn" value="default">Speichern</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
