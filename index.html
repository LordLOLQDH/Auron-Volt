<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f5f7">
<title>Auron Vault</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;min-height:100vh;padding:20px}.wrap{max-width:760px;margin:auto}.screen{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center}.panel{width:100%;background:white;border:1px solid #e1e3e7;border-radius:20px;padding:24px;box-shadow:0 12px 35px rgba(0,0,0,.07)}.login{max-width:380px}.logo{width:58px;height:58px;margin:0 auto 18px;border-radius:17px;background:#17191d;color:white;display:grid;place-items:center;font-size:25px;font-weight:800}.login h1{text-align:center;margin:0;font-size:27px}.sub{text-align:center;color:#737983;margin:8px 0 25px}label{display:block;font-size:14px;font-weight:600;margin-bottom:15px}input,textarea{width:100%;padding:13px;border:1px solid #d7d9de;border-radius:12px;background:white;color:#17191d;font-size:16px;outline:0}button{border:0;border-radius:12px;padding:13px 15px;background:#17191d;color:white;font-weight:700;font-size:15px}.wide{width:100%}.error{color:#b42318;min-height:18px;font-size:13px}.hint{color:#737983;font-size:12px;line-height:1.5}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:24px}.top button{background:#e9ebef;color:#17191d}.search{margin-bottom:14px}.entry{background:white;border:1px solid #e1e3e7;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:12px;background:#eef0f3;display:grid;place-items:center;font-weight:800}.main{flex:1;min-width:0}.name{font-weight:700}.user{font-size:13px;color:#737983;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry button{background:#eef0f3;color:#17191d;font-size:13px}.empty{text-align:center;padding:45px 10px;color:#737983;background:white;border:1px dashed #d7d9de;border-radius:16px}.fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0}dialog{border:0;border-radius:18px;padding:0;width:min(92vw,520px);box-shadow:0 20px 70px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.45)}.modal{padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h2{margin:0;font-size:21px}.x{background:transparent;color:#555;font-size:25px;padding:2px 8px}.row{display:flex;gap:8px}.row input{flex:1}.row button{background:#eef0f3;color:#17191d}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{background:#eef0f3;color:#17191d}
</style>
</head>
<body><div class="wrap">
<section id="loginScreen" class="screen"><div class="panel login"><div class="logo">A</div><h1>Auron Vault</h1><p class="sub">Dein privater Passwort-Tresor</p><form id="loginForm"><label>Master-Passwort<input id="master" type="password" minlength="12" required autocomplete="current-password"></label><button class="wide" type="submit">Entsperren</button><p id="loginError" class="error"></p><p class="hint">Dein Master-Passwort wird nicht gespeichert.</p></form></div></section>
<section id="vaultScreen" class="screen" style="display:none;align-items:flex-start"><div style="width:100%"><header class="top"><h1>Auron Vault <small id="count"></small></h1><button id="lock" type="button">Sperren</button></header><div class="search"><input id="search" placeholder="Passwort suchen..." autocomplete="off"></div><div id="entries"></div><button id="add" class="fab" type="button">+</button></div></section>
</div>
<dialog id="dialog"><form id="entryForm" class="modal"><div class="head"><h2 id="title">Neuer Eintrag</h2><button id="close" class="x" type="button">×</button></div><input id="id" type="hidden"><label>Name<input id="name" required></label><label>Website<input id="website" type="url" placeholder="https://example.com"></label><label>Benutzername<input id="username" autocomplete="off"></label><label>Passwort<div class="row"><input id="password" type="password" required autocomplete="new-password"><button id="generate" type="button">Generieren</button></div></label><label>Notiz<textarea id="notes"></textarea></label><div class="actions"><button id="cancel" class="secondary" type="button">Abbrechen</button><button type="submit">Speichern</button></div></form></dialog>
<script>
const DB='auron-vault-db',VER=1,STORE='vault';let key=null,salt=null,items=[];const $=x=>document.getElementById(x),te=new TextEncoder(),td=new TextDecoder();
function rand(n){return crypto.getRandomValues(new Uint8Array(n))}function b64(a){return btoa(String.fromCharCode(...new Uint8Array(a)))}function ub64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function read(){let d=await openDB();return new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).get('data');r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
async function write(v){let d=await openDB();return new Promise((ok,no)=>{let r=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,'data');r.onsuccess=ok;r.onerror=()=>no(r.error)})}
async function derive(p,s){let b=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:600000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function save(){let iv=rand(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(items)));await write({version:1,salt:b64(salt),iv:b64(iv),data:b64(ct)})}
async function unlock(p){let old=await read();if(!old){salt=rand(16);key=await derive(p,salt);items=[];await save();return true}salt=ub64(old.salt);let k=await derive(p,salt);try{let raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(old.iv)},k,ub64(old.data));items=JSON.parse(td.decode(raw));key=k;return true}catch{return false}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let q=$('search').value.toLowerCase(),a=items.filter(x=>(x.name+' '+x.username+' '+x.website).toLowerCase().includes(q));$('count').textContent=' · '+items.length;$('entries').innerHTML=a.length?a.map(x=>'<article class="entry"><div class="avatar">'+esc((x.name||'?')[0].toUpperCase())+'</div><div class="main"><div class="name">'+esc(x.name)+'</div><div class="user">'+esc(x.username||x.website||'')+'</div></div><button type="button" data-id="'+esc(x.id)+'">Öffnen</button></article>').join(''):'<div class="empty">Noch keine Einträge.<br>Tippe auf +, um einen Zugang zu speichern.</div>'}
function gen(){let c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*-_=+',a=rand(24);return Array.from(a,n=>c[n%c.length]).join('')}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';if($('master').value.length<12){$('loginError').textContent='Mindestens 12 Zeichen verwenden.';return}if(await unlock($('master').value)){$('master').value='';$('loginScreen').style.display='none';$('vaultScreen').style.display='flex';render()}else $('loginError').textContent='Falsches Master-Passwort.'};
$('lock').onclick=()=>{key=null;salt=null;items=[];$('vaultScreen').style.display='none';$('loginScreen').style.display='flex'};
$('add').onclick=()=>{$('entryForm').reset();$('id').value='';$('title').textContent='Neuer Eintrag';$('dialog').showModal()};$('close').onclick=$('cancel').onclick=()=>$('dialog').close();$('generate').onclick=()=>{$('password').value=gen();$('password').type='text';setTimeout(()=>$('password').type='password',1200)};$('search').oninput=render;
$('entries').onclick=e=>{let x=items.find(v=>v.id===e.target.dataset.id);if(!x)return;$('id').value=x.id;$('name').value=x.name;$('website').value=x.website||'';$('username').value=x.username||'';$('password').value=x.password;$('notes').value=x.notes||'';$('title').textContent='Eintrag bearbeiten';$('dialog').showModal()};
$('entryForm').onsubmit=async e=>{e.preventDefault();let id=$('id').value||crypto.randomUUID(),x={id,name:$('name').value.trim(),website:$('website').value.trim(),username:$('username').value.trim(),password:$('password').value,notes:$('notes').value};let i=items.findIndex(v=>v.id===id);if(i<0)items.push(x);else items[i]=x;await save();$('dialog').close();render()};
</script></body></html>
