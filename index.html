<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auron Vault</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f4f5f7;color:#17191d}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.login{width:100%;max-width:380px;background:#fff;border:1px solid #e1e3e7;border-radius:20px;padding:32px 24px;box-shadow:0 12px 35px rgba(0,0,0,.08)}.logo{width:58px;height:58px;margin:0 auto 20px;border-radius:17px;background:#17191d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800}.login h1{margin:0;text-align:center;font-size:27px}.subtitle{margin:8px 0 28px;text-align:center;color:#737983;font-size:14px}label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}input{width:100%;padding:14px;border:1px solid #d7d9de;border-radius:12px;background:#fff;color:#17191d;font-size:16px;outline:none}input:focus{border-color:#17191d}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#17191d;color:#fff;font-size:16px;font-weight:700}
</style>
</head>
<body>
<main class="login">
<div class="logo">A</div>
<h1>Auron Vault</h1>
<p class="subtitle">Passwort-Tresor</p>
<form>
<label for="password">Passwort</label>
<input id="password" type="password" placeholder="Passwort eingeben">
<button type="button">Entsperren</button>
</form>
</main>
</body>
</html>
